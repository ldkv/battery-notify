version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    allow:
      - dependency-type: "all"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    ignore:
      # Must match the version `windows` depends on (see rust/Cargo.toml).
      - dependency-name: "windows-collections"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
