name: "Build Windows executable"

on:
  pull_request:
    paths:
      - "main.spec"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/build-windows.yml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Taskfile CLI
        uses: go-task/setup-task@v2

      - name: Build executable
        run: task generate-executable

      # The windowed exe shows an error dialog instead of exiting on a crash,
      # so wait for the first battery check to be logged rather than for the process to exit.
      - name: Smoke test executable
        shell: pwsh
        run: |
          $workDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/smoke"
          $logFile = Join-Path $workDir "battery_notifier.log"
          Start-Process -FilePath (Resolve-Path "dist/battery_notifier.exe") -WorkingDirectory $workDir
          $deadline = (Get-Date).AddSeconds(120)
          $passed = $false
          while (-not $passed -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $passed = (Test-Path $logFile) -and (Select-String -Path $logFile -Pattern "Next check in" -Quiet)
          }
          Stop-Process -Name "battery_notifier" -Force -ErrorAction SilentlyContinue
          if (Test-Path $logFile) { Get-Content $logFile }
          if (-not $passed) { throw "Executable did not complete its first battery check" }

      - name: Rename executable with version
        id: rename
        shell: pwsh
        run: |
          $name = "battery_notifier-$(uv version --short)-windows-x64.exe"
          Move-Item "dist/battery_notifier.exe" "dist/$name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: dist/${{ steps.rename.outputs.name }}
          if-no-files-found: error
