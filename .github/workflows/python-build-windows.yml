name: "Python: Build Windows executable"

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/python-build-windows.yml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # Build with uv's standalone Python, as on a developer machine, not the runner's preinstalled one
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install Taskfile CLI
        uses: go-task/setup-task@v2

      # Nuitka's C compiler cache: unchanged modules are not compiled again
      - name: Cache Nuitka
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock', 'Taskfile.yml') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build executable
        run: task generate-executable

      # The windowed exe shows an error dialog instead of exiting on a crash,
      # so wait for each step to be logged rather than for the process to exit.
      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/battery_notifier.exe"
          $logFile = Join-Path $env:LOCALAPPDATA "battery-notifier/Logs/battery_notifier.log"
          function Wait-ForLog($pattern) {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern $pattern -Quiet)) { return $true }
              Start-Sleep -Seconds 2
            }
            return $false
          }
          Start-Process -FilePath $exe
          $tray = Wait-ForLog "Next check in"
          Start-Process -FilePath $exe -ArgumentList "settings"
          $dialog = Wait-ForLog "Settings dialog ready"
          if ($dialog) {
            Start-Sleep -Seconds 2
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save("$env:RUNNER_TEMP/settings-dialog.png")
          }
          Stop-Process -Name "battery_notifier" -Force -ErrorAction SilentlyContinue
          # The tray starts the dialog with a pipe on its stdin: closing that pipe must close the dialog
          $start = [System.Diagnostics.ProcessStartInfo]::new($exe, "settings --close-with-tray")
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $watched = [System.Diagnostics.Process]::Start($start)
          Start-Sleep -Seconds 10
          $stayedOpen = -not $watched.HasExited
          $watched.StandardInput.Close()
          $closedWithTray = $watched.WaitForExit(30000)
          Stop-Process -Name "battery_notifier" -Force -ErrorAction SilentlyContinue
          if (Test-Path $logFile) { Get-Content $logFile }
          if (-not $tray) { throw "Executable did not complete its first battery check" }
          if (-not $dialog) { throw "Settings dialog did not open" }
          if (-not $stayedOpen) { throw "Settings dialog closed while the tray pipe was open" }
          if (-not $closedWithTray) { throw "Settings dialog did not close with the tray" }

      - name: Upload settings dialog screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: settings-dialog-screenshot
          path: ${{ runner.temp }}/settings-dialog.png
          if-no-files-found: ignore

      - name: Rename executable with version
        id: rename
        shell: pwsh
        run: |
          $name = "battery_notifier-$(uv version --short)-windows-x64.exe"
          Move-Item "dist/battery_notifier.exe" "dist/$name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: dist/${{ steps.rename.outputs.name }}
          if-no-files-found: error
