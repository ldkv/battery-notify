name: "Linter and tests"

on:
  pull_request:
    paths-ignore: &ignored
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore: *ignored

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # The toolchain pinned in rust-toolchain.toml is installed by rustup on first use
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
