name: "Linter, type checker, and tests"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Taskfile CLI
        uses: go-task/setup-task@v2

      - name: Check code quality and run tests
        run: task check-all
        env:
          DIALOG_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Upload settings dialog screenshots
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: settings-dialog-errors
          path: screenshots
          if-no-files-found: ignore
