name: "Python: Linter, type checker, and tests"

on:
  pull_request:
    paths:
      - "Taskfile.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/python-ci.yml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install Taskfile CLI
        uses: go-task/setup-task@v2

      - name: Check code quality and run tests
        run: task check-all
        env:
          DIALOG_SCREENSHOTS: ${{ github.workspace }}/screenshots

      - name: Upload settings dialog screenshots
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: settings-dialog-errors
          path: screenshots
          if-no-files-found: ignore

      - name: Render tray icon preview
        if: runner.os == 'Windows'
        run: uv run python scripts/render_icons.py icons.png

      - name: Upload tray icon preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: tray-icons
          path: icons.png
