name: "Release please"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach the executables to, e.g. v0.6.0"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Tags v<version>, which the updater of 0.5.x and later looks for
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.prs || '[]' }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # release-please bumps Cargo.toml, not Cargo.lock
  sync-lock-file:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.pr.headBranchName }}

      - name: Sync lock file with bumped version
        run: |
          cargo update --workspace
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: sync lock file"
            git push
          fi

  # Run after release-please creates a release, or manually for an existing tag
  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || startsWith(inputs.tag, 'v')) }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The zips: artifacts named after their file, not the screenshots.
      # skip-decompress keeps the zips as they are; each lands in a folder named after the
      # artifact, so the file keeps its name whatever name the download gives it.
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: battery_notifier_rust-*
          skip-decompress: true
          path: artifacts

      - name: Collect executables
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            mv "$dir"* "dist/$name"
          done
          ls -l dist

      # The app's updater only installs a zip signed for its file name: see README.md
      - name: Checkout public signing key
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: updater-key.pub
          sparse-checkout-cone-mode: false
          path: repo

      - name: Sign the zips
        working-directory: dist
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
        run: |
          cargo install zipsign --version 0.2.2 --locked
          key="$RUNNER_TEMP/zipsign.key"
          echo "$ZIPSIGN_PRIVATE_KEY" | base64 -d > "$key"
          for zip in battery_notifier_rust-*.zip; do
            zipsign sign zip "$zip" "$key"
            zipsign verify zip "$zip" ../repo/updater-key.pub
          done
          rm "$key"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Upload release assets
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
