name: "Release please"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach the executables to, e.g. v0.3.0"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@v10.3.2

      # release-please bumps pyproject.toml and rust/Cargo.toml, not their lock files
      - name: Sync lock files with bumped version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          uv lock
          (cd rust && cargo update --workspace)
          if ! git diff --quiet -- uv.lock rust/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock rust/Cargo.lock
            git commit -m "chore: sync lock files"
            git push
          fi

  # Run after release-please creates a release, or manually for an existing tag
  build-python:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/python-build-windows.yml
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  build-rust:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/rust-build.yml
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build-python, build-rust]
    if: ${{ !cancelled() && needs.build-python.result == 'success' && needs.build-rust.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Python Windows executable
        uses: actions/download-artifact@v8
        with:
          name: windows-executable
          path: dist

      - name: Download Rust Windows executable
        uses: actions/download-artifact@v8
        with:
          name: rust-windows-executable
          path: dist

      - name: Download Rust macOS app
        uses: actions/download-artifact@v8
        with:
          name: rust-macos-app
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.exe *.zip > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Upload release assets
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
