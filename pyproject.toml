[project]
name = "battery_notifier"
version = "0.4.1"
requires-python = "==3.14.9"
description = "Notify when battery is low"
readme = "README.md"
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "hidapi==0.15.0",
    "pillow==13.0.0",
    "platformdirs==4.13.5",
    "pystray==0.19.5",
    "sv-ttk==2.6.1",
    "tomli-w==1.2.0",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-windows-devices-enumeration==3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation==3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation-collections==3.2.1; sys_platform == 'win32'",
]

[project.scripts]
battery-notifier = "battery_notifier.main:main"

[dependency-groups]
dev = ["nuitka==4.3.1", "pyrefly==1.4.0", "pytest==9.1.1", "ruff==0.17.2", "zstandard==0.25.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ldkv/battery-notify"
Documentation = "https://github.com/ldkv/battery-notify/blob/main/README.md"
Changelog = "https://github.com/ldkv/battery-notify/releases"

# Ruff: code formatter + linter
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C", "Q", "B", "A", "PL", "I"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

# pyrefly
[tool.pyrefly]
preset = "default"
# Windows is the main target: check Windows-only modules against the Windows stubs on every OS
python-platform = "win32"
# hidapi ships a compiled module without type stubs; winrt is only installed on Windows
ignore-missing-imports = ["hid", "winrt.*"]

# pytest
[tool.pytest.ini_options]
addopts = "-vv -s"
