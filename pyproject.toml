[project]
name = "battery_notifier"
version = "0.2.1"
requires-python = "==3.14.9"
description = "Notify when battery is low"
readme = "README.md"
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["hidapi==0.15.0", "pillow==13.0.0", "pystray==0.19.5"]

[dependency-groups]
dev = ["pyinstaller==6.22.3", "pyrefly==1.4.0", "pytest==9.1.1", "ruff==0.17.2"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ldkv/battery-notify"
Documentation = "https://github.com/ldkv/battery-notify/blob/main/README.md"
Changelog = "https://github.com/ldkv/battery-notify/releases"

# Ruff: code formatter + linter
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C", "Q", "B", "A", "PL", "I"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

# pyrefly
[tool.pyrefly]
preset = "default"
# hidapi ships a compiled module without type stubs
ignore-missing-imports = ["hid"]

# pytest
[tool.pytest.ini_options]
addopts = "-vv -s"
