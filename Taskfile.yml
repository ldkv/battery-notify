version: "3"

tasks:
  default: task help

  help:
    desc: show help message
    cmd: task --list-all

  tree:
    desc: Show the dependency tree
    cmds:
      - cargo tree

  format-check:
    desc: Verify code formatting
    cmds:
      - cargo fmt --check

  format:
    desc: Format code
    cmds:
      - cargo fmt

  lint-check:
    desc: Verify code linting
    cmds:
      - cargo clippy --locked --all-targets -- -D warnings

  lint-fix:
    desc: Apply linting fixes to codebase - use with caution
    cmds:
      - cargo clippy --fix --allow-dirty --all-targets

  code-quality:
    desc: Run the formatter check and the linter
    deps: [format-check, lint-check]

  test:
    desc: Run the tests in local environment
    cmds:
      - cargo test --locked

  check-all:
    desc: Run all checks and tests
    deps: [code-quality, test]

  build:
    desc: Build the release executable into target/release/
    cmds:
      - cargo build --release --locked

  build-macos:
    desc: Build a universal macOS app into "target/release/Battery Notifier.app"
    cmds:
      - rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - macos/bundle.sh
