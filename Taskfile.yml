version: "3"

dotenv:
  - .env
  - .env.example

tasks:
  default: task help

  help:
    desc: show help message
    cmd: task --list-all

  install-uv:
    desc: Install uv if not found
    status:
      - uv -V
    cmds:
      - echo "uv not found, installing..."
      - curl -LsSf https://astral.sh/uv/install.sh | sh

  tree:
    desc: Show the project dependency tree with outdated packages and sizes
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv tree --outdated --show-sizes

  dev-install:
    desc: Install all dependencies including dev, extras
    dir: "{{.USER_WORKING_DIR}}"
    deps: [install-uv]
    cmds:
      - uv venv --clear
      - uv sync

  dependencies-check:
    desc: Check the dependencies are up to date
    cmds:
      - uv lock --check

  format-check:
    desc: Verify code formatting
    cmds:
      - uv run ruff format --check .

  format:
    desc: Format code
    cmds:
      - uv run ruff format .

  lint-check:
    desc: Verify code linting
    cmds:
      - uv run ruff check .

  lint-fix:
    desc: Apply linting fixes to codebase - use with caution
    cmds:
      - uv run ruff check --fix .

  type-check:
    desc: Run the type checker
    cmd: uv run pyrefly check

  code-quality:
    desc: Run the linters and static type checker
    deps: [format-check, lint-check, type-check]

  test:
    desc: Run the tests in local environment
    cmds:
      - uv run pytest .

  check-all:
    desc: Run all checks and tests
    deps: [dependencies-check, code-quality, test]

  generate-executable:
    desc: Generate a standalone executable into dist/, Windows only
    vars:
      VERSION:
        sh: uv version --short
      TCL_TK_OPTIONS:
        sh: uv run python scripts/tcl_tk_libraries.py build/tcl_tk
    cmds:
      # The unpacked files are cached per version, so only the first launch of a version unpacks them.
      # Windows 10+ ships the Universal C runtime, no need to bundle it.
      # Keep the tempdir spec in sync with UNPACK_ROOT in src/battery_notifier/launcher.py
      - >-
        uv run python -m nuitka src/battery_notifier/main.py
        --mode=onefile
        --onefile-cache-mode=cached
        --onefile-tempdir-spec="{CACHE_DIR}/battery-notifier/app/{VERSION}"
        --windows-console-mode=disable
        --enable-plugin=tk-inter {{.TCL_TK_OPTIONS}}
        --include-distribution-metadata=battery_notifier
        --include-package=winrt
        --include-windows-runtime-dlls=no
        --python-flag=no_docstrings
        --product-name="Battery Notifier"
        --product-version={{.VERSION}}
        --file-version={{.VERSION}}
        --output-dir=dist
        --output-filename=battery_notifier.exe
        --assume-yes-for-downloads

  rust-check:
    desc: Verify formatting and linting of the Rust version
    dir: rust
    cmds:
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    desc: Run the tests of the Rust version
    dir: rust
    cmds:
      - cargo test --locked

  rust-build:
    desc: Build the release executable of the Rust version into rust/target/release/
    dir: rust
    cmds:
      - cargo build --release --locked
