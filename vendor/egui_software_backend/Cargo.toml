# Vendored from egui_software_backend 0.0.3 (https://github.com/DGriffin91/egui_software_backend),
# ported to egui 0.37 (the crate targets egui 0.34) and trimmed to its sources.
# Changes: std HashMap instead of `egui::ahash`, one texture delta list per id, the new
# `ViewportBuilder::monitor` field and viewport commands, a `centered` window option,
# and no `test_render` feature.
[package]
name = "egui_software_backend"
version = "0.0.3"
edition = "2024"
description = "A CPU software render backend for egui."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std", "winit"]
log = ["dep:log"]
raster_stats = ["std"]
rayon = ["dep:rayon"]
std = []
winit = ["dep:winit", "softbuffer", "egui-winit", "bytemuck"]

[dependencies]
bytemuck = { version = "1.25", optional = true }
constify = "0.0.1"
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", optional = true, default-features = false }
log = { version = "0.4", optional = true }
rayon = { version = "1.11.0", optional = true }
softbuffer = { version = "0.4", optional = true }
strength_reduce = "0.2.4"
winit = { version = "0.30", optional = true }
