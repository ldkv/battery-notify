[package]
name = "battery-notifier"
version = "0.4.0"
edition = "2024"
description = "Notify when battery is low"
license = "MIT"
publish = false

[dependencies]
ab_glyph = "0.2.32"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
hidapi = "2.6.7"
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tray-icon = "0.26.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Pull request builds in CI: same code, faster to build, a bit bigger and slower to run
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Devices_Enumeration", "Foundation_Collections", "Win32_System_Threading", "Win32_System_Console", "Win32_Foundation", "Win32_Security"] }
# Must match the windows-collections version that `windows` depends on: its WinRT
# APIs take these collection types, and `windows` does not re-export the crate.
# windows 0.62 uses windows-collections 0.3; bump both together.
windows-collections = "0.3.2"
windows-registry = "0.100.0"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
tempfile = "3.27.0"
